[project]
name = "url-shorten"
version = "0.2.0"
description = "A simple URL shortener built with Python."
authors = [
    { name = "Karthik Udyawar", email = "karthikajitudy@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyshorteners>=1.0.1,<2.0.0",
    "pyperclip>=1.9.0,<2.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
